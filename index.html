<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>ریاضی تعاملی | هفتم، هشتم، نهم</title>
<meta name="description" content="آموزش تعاملی ریاضی پایه‌های هفتم، هشتم و نهم">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>➗</text></svg>">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#1e1b4b;line-height:1.9;min-height:100vh;
  background:#faf8ff radial-gradient(circle at 1px 1px,#ddd6fe 1px,transparent 0) 0 0/22px 22px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header{padding:56px 0 34px;text-align:center;position:relative;overflow:hidden}
.symbols{position:absolute;inset:0;pointer-events:none;font-family:Lalezar,sans-serif;color:#7c3aed;opacity:.09;font-size:56px}
.symbols span{position:absolute;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(8deg)}}
.badge{display:inline-block;background:#ede9fe;color:#6d28d9;font-weight:800;font-size:14px;padding:4px 16px;border-radius:999px}
h1{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:clamp(44px,8vw,78px);line-height:1.25;margin:12px 0 4px;
  background:linear-gradient(135deg,#6d28d9,#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:clamp(16px,2.6vw,20px);color:#4338ca;margin:0}
.teacher{margin-top:10px;color:#6b7280;font-size:15px}
.tabs{display:flex;justify-content:center;gap:12px;margin:8px 0 28px;flex-wrap:wrap}
.tab{border:0;cursor:pointer;font-family:Lalezar,Vazirmatn,sans-serif;font-size:24px;padding:10px 30px;border-radius:18px;background:#fff;color:#4c1d95;
  box-shadow:0 4px 16px #4c1d9514;border:2px solid #ede9fe;transition:.2s}
.tab:hover{transform:translateY(-2px)}
.tab.on{color:#fff;border-color:transparent;background:var(--c);box-shadow:0 10px 26px -6px var(--c)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));padding-bottom:40px}
.ch{position:relative;display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:22px;padding:20px 20px 18px;border:2px solid #f1edff;
  box-shadow:0 6px 22px #4c1d950d;transition:.2s;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.ch .num{font-family:Lalezar,sans-serif;font-size:15px;color:var(--c);opacity:.9}
.ch .t{font-weight:800;font-size:19px;line-height:1.6}
.ch .st{margin-top:auto;font-size:13px;font-weight:700}
.ch.live{cursor:pointer;border-color:var(--c)}
.ch.live:hover{transform:translateY(-4px);box-shadow:0 16px 34px -10px var(--c)}
.ch.live .st{color:#fff;background:var(--c);align-self:flex-start;padding:3px 14px;border-radius:999px}
.ch.soon{opacity:.6}
.ch.soon .st{color:#9ca3af}
.big{position:absolute;left:14px;top:6px;font-family:Lalezar,sans-serif;font-size:64px;color:var(--c);opacity:.1;line-height:1}
footer{text-align:center;color:#6b7280;font-size:14px;padding:20px 0 34px}
</style>
</head>
<body>
<header>
  <div class="symbols"><span style="top:12%;right:8%">π</span><span style="top:60%;right:18%;animation-delay:-2s">√</span><span style="top:20%;left:10%;animation-delay:-4s">∑</span><span style="top:65%;left:20%;animation-delay:-6s">÷</span><span style="top:40%;left:45%;animation-delay:-3s;font-size:40px">×</span></div>
  <div class="wrap">
    <span class="badge">ریاضی متوسطه اول</span>
    <h1 id="sn"></h1>
    <p class="tag" id="tg"></p>
    <div class="teacher" id="te"></div>
  </div>
</header>
<main class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</main>
<footer id="ft"></footer>
<script src="lessons.js"></script>
<script>
(function(){
  var S=window.SITE, G=window.GRADES, fa=function(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})};
  document.getElementById('sn').textContent=S.name;
  document.getElementById('tg').textContent=S.tagline;
  document.getElementById('te').textContent=S.teacher?'دبیر ریاضی: '+S.teacher:'';
  document.getElementById('ft').textContent=S.name+(S.teacher?' | '+S.teacher:'');
  var tabs=document.getElementById('tabs'), grid=document.getElementById('grid');
  function show(id){
    var g=G.filter(function(x){return x.id==id})[0]||G[0];
    try{localStorage.setItem('grade',g.id)}catch(e){}
    if(location.hash!=='#'+g.id)history.replaceState(null,'','#'+g.id);
    [].forEach.call(tabs.children,function(b){b.classList.toggle('on',b.dataset.id==g.id)});
    grid.style.setProperty('--c',g.color); grid.innerHTML='';
    g.chapters.forEach(function(c,i){
      var el=document.createElement(c.file?'a':'div');
      el.className='ch '+(c.file?'live':'soon'); el.style.animationDelay=(i*40)+'ms';
      if(c.file)el.href='lessons/'+c.file;
      el.innerHTML='<span class="big"></span><span class="num"></span><span class="t"></span><span class="st"></span>';
      el.querySelector('.big').textContent=fa(c.n);
      el.querySelector('.num').textContent='فصل '+fa(c.n);
      el.querySelector('.t').textContent=c.title;
      el.querySelector('.st').textContent=c.file?'شروع یادگیری ←':'به‌زودی';
      grid.appendChild(el);
    });
  }
  G.forEach(function(g){
    var b=document.createElement('button'); b.className='tab'; b.dataset.id=g.id; b.style.setProperty('--c',g.color);
    b.textContent='پایه '+g.title; b.onclick=function(){show(g.id)}; tabs.appendChild(b);
  });
  var start=location.hash.slice(1); if(!start){try{start=localStorage.getItem('grade')}catch(e){}}
  show(start||8);
  window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
})();
</script>
</body>
</html>
